<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>스마트 AI 노트</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 터치 및 스크롤 최적화 */
        body { overscroll-behavior: none; }
        .touch-none { touch-action: none; }
        
        /* 커스텀 스크롤바 */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 20px; }
        
        /* 펄스 애니메이션 (녹음 중) */
        @keyframes pulse-ring {
            0% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .recording-active .mic-icon {
            animation: pulse-ring 2s infinite;
            color: #ef4444; /* red-500 */
        }
        [hidden] { display: none !important; }
        body { margin: 0; font-family: system-ui, sans-serif; color: #1e293b; background: #f1f5f9; height: auto !important; overflow: auto !important; }
        body > header { display:flex; flex-wrap:wrap; gap:16px; align-items:center; justify-content:space-between; padding:16px 24px; background:white; }
        body > header svg { width:24px; height:24px; }
        button, input { font:inherit; }
        button { cursor:pointer; }
        button:focus-visible, input:focus-visible, textarea:focus-visible { outline:3px solid #6366f1; outline-offset:3px; }
        #contentsView, #editorView { width:min(100% - 32px, 1000px); margin:24px auto; box-sizing:border-box; }
        #editorView { display:flex; flex-direction:column; gap:24px; padding:0; overflow:visible; }
        #editorView > div { min-width:0; background:white; border-radius:16px; overflow:hidden; }
        #editorView svg { width:20px; height:20px; display:inline-block; vertical-align:middle; }
        #editorView h2 { margin:0; font-size:17px; }
        #editorView button { border-radius:8px; padding:8px 12px; }
        #editorView .color-btn { width:26px; height:26px; padding:0; border:2px solid #cbd5e1; }
        .color-btn[data-color="#000000"] { background:#000; }
        .color-btn[data-color="#ef4444"] { background:#ef4444; }
        .color-btn[data-color="#3b82f6"] { background:#3b82f6; }
        .color-btn[data-color="#22c55e"] { background:#22c55e; }
        #summaryContainer { margin:16px; padding:16px; background:#eef2ff; }
        #summaryContent { padding-top:12px; }
        .note-actions { display:flex; flex-wrap:wrap; gap:12px; align-items:center; padding:16px; background:white; border-radius:12px; }
        .note-actions input { max-width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:6px; }
        .primary-action { border:0; border-radius:8px; background:#4f46e5; color:white; padding:10px 16px; }
        .secondary-action { border:1px solid #cbd5e1; border-radius:8px; background:white; padding:10px 16px; }
        #noteTextarea { box-sizing:border-box; min-height:260px; width:100%; padding:20px; border:0; font:inherit; resize:vertical; }
        #canvasContainer { position:relative; height:420px; flex:none; background:#fafaf9; }
        #drawingCanvas { position:absolute; inset:0; touch-action:none; }
        #contentsHeader { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px; }
        .date-group { margin:28px 0; }
        .note-card { display:block; width:100%; text-align:left; margin:12px 0; padding:18px; border:1px solid #e2e8f0; border-radius:12px; background:white; }
        .note-card:hover { border-color:#818cf8; }
        .note-kind { font-size:13px; color:#4f46e5; font-weight:600; }
        .note-preview { display:block; margin-top:8px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        #saveStatus { min-height:24px; color:#475569; }
        #summaryContent { white-space:pre-wrap; }
        .hidden { display:none !important; }
        #messageModal:not(.hidden) { position:fixed; inset:0; background:#0008; display:flex; align-items:center; justify-content:center; z-index:50; }
        #messageModal > div { background:white; padding:24px; border-radius:12px; max-width:400px; }
        @media(max-width:600px) { body > header { padding:12px; } #canvasContainer { height:360px; } .note-actions { align-items:stretch; flex-direction:column; } }
        .drawing-toolbar { padding:16px; background:#f8fafc; border-bottom:1px solid #e2e8f0; }
        .tool-row { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:12px; }
        .drawing-toolbar button { border:1px solid #cbd5e1; background:white; font-size:14px; }
        .drawing-toolbar button[aria-pressed="true"] { background:#e0e7ff; border-color:#4f46e5; color:#3730a3; box-shadow:0 0 0 1px #4f46e5; }
        .drawing-toolbar button:disabled { opacity:.4; cursor:default; }
        .color-palette { display:flex; gap:8px; padding:4px; }
        #editorView .color-btn[aria-pressed="true"] { outline:2px solid #4f46e5; outline-offset:2px; }
        .color-btn[data-color="#a855f7"] { background:#a855f7; }
        .color-btn[data-color="#eab308"] { background:#eab308; }
        .size-control { display:flex; gap:8px; align-items:center; }
        #penSize { width:120px; } #penSizeValue { min-width:45px; }
        #drawingHint { margin:0; color:#64748b; font-size:13px; }
        #canvasContainer { height:auto; aspect-ratio:5 / 3; background-color:#fff; background-image:linear-gradient(#e2e8f0 1px,transparent 1px),linear-gradient(90deg,#e2e8f0 1px,transparent 1px); background-size:24px 24px; }
        #canvasContainer[data-paper="ruled"] { background-image:linear-gradient(#dbeafe 1px,transparent 1px); background-size:100% 28px; }
        #canvasContainer[data-paper="plain"] { background-image:none; }
        #editorView > .drawing-expanded { position:fixed; inset:0; z-index:40; overflow:auto; border-radius:0; padding:12px; }
        @media(max-width:600px) { .drawing-toolbar { padding:12px; } #editorView .tool-btn { flex:1 0 20%; padding:12px 4px; } .tool-row { gap:8px; } }
    </style>
</head>
<body class="bg-slate-100 h-screen flex flex-col text-slate-800 font-sans overflow-hidden">

    <!-- 상단 헤더 -->
    <header class="bg-white shadow-sm px-6 py-3 flex justify-between items-center z-10">
        <div class="flex items-center gap-3">
            <svg class="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
            </svg>
            <h1 class="text-xl font-bold text-slate-800 tracking-tight">스마트 AI 노트</h1>
        </div>
        <div class="flex items-center gap-4">
            <div class="relative group">
                <input type="password" id="apiKeyInput" placeholder="Gemini API 키 입력" class="w-48 px-3 py-1.5 text-sm border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all">
            </div>
            <button id="aiSummaryBtn" class="flex items-center gap-2 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white px-4 py-2 rounded-lg font-medium shadow-sm transition-all active:scale-95">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                AI 요약
            </button>
        </div>
    </header>

    <section id="contentsView" aria-label="메모 목차">
        <div id="contentsHeader"><div><h2>메모 목차</h2><p>작성일자별 텍스트 메모와 필기 메모를 모아보세요.</p></div><button id="newNoteBtn" class="primary-action">새 메모 작성</button></div>
        <p>메모는 현재 브라우저에 저장됩니다. 한 줄 요약은 직접 입력하거나 텍스트 내용에서 자동으로 표시합니다.</p>
        <div id="noteList"></div>
    </section>
    <div id="editorNavigation" class="note-actions" hidden><button id="backToContentsBtn" class="secondary-action">← 목차</button><span id="saveStatus" role="status" aria-live="polite"></span></div>
    <!-- 메인 워크스페이스 -->
    <main id="editorView" hidden>
        
        <!-- 왼쪽 패널: 텍스트 및 음성 인식 -->
        <div class="flex-1 flex flex-col gap-4 min-w-[300px]">
            <div class="note-actions">
                <label>텍스트 작성일자 <input type="date" id="textDate" required></label>
                <label>한 줄 요약 <input type="text" id="textPreview" maxlength="120" placeholder="비워두면 본문에서 표시"></label>
                <button id="saveTextBtn" class="primary-action">텍스트 메모 저장</button>
            </div>
            <!-- 텍스트 편집 영역 -->
            <div class="flex-1 bg-white rounded-2xl shadow-sm border border-slate-200 flex flex-col overflow-hidden">
                <div class="px-4 py-3 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                    <h2 class="font-semibold text-slate-700 flex items-center gap-2">
                        <svg class="w-5 h-5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7"></path></svg>
                        텍스트 메모
                    </h2>
                    <button id="dictationBtn" class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-200 hover:bg-slate-300 text-slate-700 text-sm font-medium transition-colors">
                        <svg class="w-4 h-4 mic-icon transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
                        <span id="dictationStatus">받아쓰기 시작</span>
                    </button>
                </div>
                <div class="flex-1 relative">
                    <textarea id="noteTextarea" class="w-full h-full p-5 resize-none outline-none text-slate-800 text-lg leading-relaxed placeholder-slate-300" placeholder="여기에 타이핑하거나 마이크 버튼을 눌러 음성으로 기록하세요..."></textarea>
                </div>
            </div>

            <!-- AI 요약 결과 영역 (기본 숨김) -->
            <div id="summaryContainer" class="hidden h-1/3 bg-indigo-50/50 rounded-2xl shadow-sm border border-indigo-100 flex flex-col overflow-hidden">
                <div class="px-4 py-2 border-b border-indigo-100 flex justify-between items-center bg-indigo-50">
                    <h2 class="font-semibold text-indigo-800 flex items-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path></svg>
                        AI 핵심 요약
                    </h2>
                    <button id="closeSummaryBtn" class="text-indigo-400 hover:text-indigo-600">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>
                <div id="summaryContent" class="flex-1 p-4 overflow-y-auto text-slate-700 text-base leading-relaxed">
                    <!-- 요약 내용 렌더링 -->
                </div>
            </div>
        </div>

        <!-- 오른쪽 패널: 캔버스 손필기 -->
        <div class="flex-1 bg-white rounded-2xl shadow-sm border border-slate-200 flex flex-col overflow-hidden min-w-[300px]">
            <div class="note-actions">
                <h2>필기 메모</h2>
                <label>필기 작성일자 <input type="date" id="drawingDate" required></label>
                <label>한 줄 요약 <input type="text" id="drawingPreview" maxlength="120" placeholder="필기 내용을 한 줄로 입력하세요"></label>
                <button id="saveDrawingBtn" class="primary-action">필기 메모 저장</button>
            </div>
            <div class="drawing-toolbar" aria-label="필기 도구">
                <div class="tool-row" role="group" aria-label="도구 선택">
                    <button class="tool-btn" data-tool="pen" aria-pressed="true">펜</button>
                    <button class="tool-btn" data-tool="fountain" aria-pressed="false">만년필</button>
                    <button class="tool-btn" data-tool="pencil" aria-pressed="false">연필</button>
                    <button class="tool-btn" data-tool="highlighter" aria-pressed="false">형광펜</button>
                    <button class="tool-btn" data-tool="eraser" aria-pressed="false">지우개</button>
                    <button class="tool-btn" data-tool="line" aria-pressed="false">직선</button>
                    <button class="tool-btn" data-tool="rectangle" aria-pressed="false">사각형</button>
                    <button class="tool-btn" data-tool="ellipse" aria-pressed="false">원</button>
                </div>
                <div class="tool-row">
                    <label class="size-control">굵기 <input id="penSize" type="range" min="1" max="40" step="0.5" value="3"><output id="penSizeValue" for="penSize">3 px</output></label>
                    <div role="group" aria-label="잉크 색상" class="color-palette">
                        <button class="color-btn" data-color="#000000" aria-label="검정" aria-pressed="true"></button>
                        <button class="color-btn" data-color="#ef4444" aria-label="빨강" aria-pressed="false"></button>
                        <button class="color-btn" data-color="#3b82f6" aria-label="파랑" aria-pressed="false"></button>
                        <button class="color-btn" data-color="#22c55e" aria-label="초록" aria-pressed="false"></button>
                        <button class="color-btn" data-color="#a855f7" aria-label="보라" aria-pressed="false"></button>
                        <button class="color-btn" data-color="#eab308" aria-label="노랑" aria-pressed="false"></button>
                    </div>
                    <label>사용자 색상 <input id="customColor" type="color" value="#000000"></label>
                </div>
                <div class="tool-row">
                    <button id="undoDrawingBtn" disabled>↶ 실행 취소</button><button id="redoDrawingBtn" disabled>↷ 다시 실행</button>
                    <label>용지 <select id="paperStyle"><option value="grid">모눈</option><option value="ruled">줄노트</option><option value="plain">무지</option></select></label>
                    <label><input id="stylusOnly" type="checkbox"> 펜으로만 쓰기</label>
                    <button id="expandDrawingBtn" aria-pressed="false">넓게 쓰기</button>
                    <button id="downloadDrawingBtn">이미지 저장</button><button id="clearCanvasBtn">전체 지우기</button>
                </div>
                <p id="drawingHint">손가락·마우스·스타일러스로 필기하세요. 도형은 끌어서 그립니다.</p>
            </div>
            <!-- 캔버스 영역 -->
            <div id="canvasContainer" class="flex-1 relative cursor-crosshair bg-stone-50 bg-[radial-gradient(#e5e7eb_1px,transparent_1px)] [background-size:16px_16px]">
                <canvas id="drawingCanvas" class="absolute inset-0 touch-none w-full h-full"></canvas>
            </div>
        </div>
    </main>

    <!-- 메시지 모달 (에러, 알림용) -->
    <div id="messageModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-50 transition-opacity opacity-0">
        <div class="bg-white rounded-xl shadow-xl p-6 max-w-sm w-full mx-4 transform scale-95 transition-transform duration-200">
            <h3 id="modalTitle" class="text-lg font-bold text-slate-800 mb-2">알림</h3>
            <p id="modalMessage" class="text-slate-600 mb-6">메시지 내용</p>
            <div class="flex justify-end">
                <button id="modalCloseBtn" class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-lg font-medium transition-colors">확인</button>
            </div>
        </div>
    </div>

    <script>
        // DOM 요소
        const textArea = document.getElementById('noteTextarea');
        const dictationBtn = document.getElementById('dictationBtn');
        const dictationStatus = document.getElementById('dictationStatus');
        
        const canvas = document.getElementById('drawingCanvas');
        const canvasContainer = document.getElementById('canvasContainer');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        
        const toolBtns = document.querySelectorAll('.tool-btn');
        const colorBtns = document.querySelectorAll('.color-btn');
        const clearCanvasBtn = document.getElementById('clearCanvasBtn');
        
        const apiKeyInput = document.getElementById('apiKeyInput');
        const aiSummaryBtn = document.getElementById('aiSummaryBtn');
        const summaryContainer = document.getElementById('summaryContainer');
        const summaryContent = document.getElementById('summaryContent');
        const closeSummaryBtn = document.getElementById('closeSummaryBtn');
        
        const messageModal = document.getElementById('messageModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalMessage = document.getElementById('modalMessage');
        const modalCloseBtn = document.getElementById('modalCloseBtn');

        // 상태 변수
        let isRecording = false;
        let recognition = null;
        
        let isDrawing = false;
        let currentTool = 'pen';
        let currentColor = '#000000';
        let currentLineWidth = 3;

        /* ==========================================================================
           1. 음성 인식 (Speech to Text) 로직
           ========================================================================== */
        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            if (!SpeechRecognition) {
                console.warn("이 브라우저는 음성 인식을 지원하지 않습니다.");
                dictationBtn.style.display = 'none';
                return;
            }

            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'ko-KR';

            recognition.onstart = function() {
                isRecording = true;
                dictationBtn.classList.add('recording-active');
                dictationStatus.textContent = '듣는 중...';
            };

            recognition.onresult = function(event) {
                let interimTranscript = '';
                let finalTranscript = '';

                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript;
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }

                if (finalTranscript) {
                    // 기존 텍스트에 이어서 작성
                    const currentText = textArea.value;
                    const separator = currentText.length > 0 && !currentText.endsWith(' ') && !currentText.endsWith('\n') ? ' ' : '';
                    textArea.value = currentText + separator + finalTranscript;
                    textArea.scrollTop = textArea.scrollHeight;
                }
            };

            recognition.onerror = function(event) {
                console.error("음성 인식 에러:", event.error);
                if(event.error === 'not-allowed') {
                    showModal('권한 오류', '마이크 접근 권한이 필요합니다.');
                }
                stopRecording();
            };

            recognition.onend = function() {
                // 사용자가 명시적으로 중지하지 않았는데 끝난 경우 (자동 중단 등)
                if(isRecording) stopRecording();
            };
        }

        function toggleRecording() {
            if (!recognition) return;
            
            if (isRecording) {
                stopRecording();
            } else {
                try {
                    recognition.start();
                } catch(e) {
                    // 이미 시작된 경우 무시
                    console.error(e);
                }
            }
        }

        function stopRecording() {
            if(recognition) recognition.stop();
            isRecording = false;
            dictationBtn.classList.remove('recording-active');
            dictationStatus.textContent = '받아쓰기 시작';
        }

        dictationBtn.addEventListener('click', toggleRecording);
        initSpeechRecognition();

        /* ==========================================================================
           2. 캔버스 손필기 로직 (애플 펜슬 지원)
           ========================================================================== */
        // Store ink at a fixed resolution so rotation and viewport changes never crop it.
        const ink = document.createElement('canvas'); ink.width = 1000; ink.height = 600;
        const inkCtx = ink.getContext('2d', {willReadFrequently:true});
        const strokeLayer = document.createElement('canvas'); strokeLayer.width = ink.width; strokeLayer.height = ink.height;
        const strokeCtx = strokeLayer.getContext('2d');
        const sizes = {pen:3,fountain:5,pencil:2,highlighter:22,eraser:24,line:3,rectangle:3,ellipse:3};
        const sizeInput = document.getElementById('penSize');
        const undoBtn = document.getElementById('undoDrawingBtn');
        const redoBtn = document.getElementById('redoDrawingBtn');
        let history = [], historyIndex = -1, points = [], pointerId = null;
        function exportInk() { return ink.toDataURL('image/png'); }
        function updateHistoryButtons() { undoBtn.disabled = historyIndex <= 0; redoBtn.disabled = historyIndex >= history.length-1; }
        function resetHistory() { history = [inkCtx.getImageData(0,0,ink.width,ink.height)]; historyIndex=0; updateHistoryButtons(); }
        function commitInk() {
            history.splice(historyIndex+1);
            history.push(inkCtx.getImageData(0,0,ink.width,ink.height));
            if (history.length>25) history.shift();
            historyIndex=history.length-1; updateHistoryButtons();
        }
        function resetInk() { inkCtx.clearRect(0,0,ink.width,ink.height); resetHistory(); renderInk(); }
        function renderInk() {
            ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
            ctx.clearRect(0,0,canvas.width,canvas.height); ctx.drawImage(ink,0,0,canvas.width,canvas.height);
            if (isDrawing) compositeStroke(ctx,canvas.width,canvas.height);
        }
        function initCanvas() {
            const rect = canvasContainer.getBoundingClientRect();
            if (!rect.width || !rect.height) return;
            const dpr = Math.min(window.devicePixelRatio || 1,3);
            canvas.width = Math.round(rect.width*dpr); canvas.height = Math.round(rect.height*dpr);
            canvas.style.width = '100%'; canvas.style.height = '100%'; renderInk();
        }
        new ResizeObserver(initCanvas).observe(canvasContainer);
        function point(e) {
            const rect = canvas.getBoundingClientRect();
            return {x:(e.clientX-rect.left)*ink.width/rect.width,y:(e.clientY-rect.top)*ink.height/rect.height,p:e.pointerType==='pen' ? Math.max(.1,e.pressure || .5) : .5};
        }
        function paintStroke() {
            strokeCtx.clearRect(0,0,ink.width,ink.height);
            strokeCtx.lineCap='round'; strokeCtx.lineJoin='round'; strokeCtx.strokeStyle=currentColor; strokeCtx.fillStyle=currentColor;
            const first=points[0], last=points[points.length-1];
            const shape=['line','rectangle','ellipse'].includes(currentTool);
            if(shape) {
                strokeCtx.lineWidth=currentLineWidth; strokeCtx.beginPath();
                if(currentTool==='line') { strokeCtx.moveTo(first.x,first.y); strokeCtx.lineTo(last.x,last.y); }
                if(currentTool==='rectangle') strokeCtx.rect(first.x,first.y,last.x-first.x,last.y-first.y);
                if(currentTool==='ellipse') strokeCtx.ellipse((first.x+last.x)/2,(first.y+last.y)/2,Math.abs(last.x-first.x)/2,Math.abs(last.y-first.y)/2,0,0,Math.PI*2);
                strokeCtx.stroke(); return;
            }
            const width = p => currentLineWidth * (currentTool==='fountain' ? .3+p*1.7 : currentTool==='pencil' ? .5+p*.7 : currentTool==='pen' ? .7+p*.6 : 1);
            strokeCtx.beginPath(); strokeCtx.arc(first.x,first.y,width(first.p)/2,0,Math.PI*2); strokeCtx.fill();
            for(let i=1;i<points.length;i++) {
                const a=points[i-1], b=points[i];
                strokeCtx.lineWidth=width((a.p+b.p)/2);
                strokeCtx.beginPath(); strokeCtx.moveTo(a.x,a.y); strokeCtx.lineTo(b.x,b.y); strokeCtx.stroke();
            }
        }
        function compositeStroke(target,w,h) {
            target.save(); target.globalAlpha=currentTool==='highlighter' ? .25 : currentTool==='pencil' ? .6 : 1;
            target.globalCompositeOperation=currentTool==='eraser' ? 'destination-out' : 'source-over';
            target.drawImage(strokeLayer,0,0,w,h); target.restore();
        }
        function startDrawing(e) {
            if (pointerId!==null || (e.pointerType==='mouse' && e.button!==0) || (document.getElementById('stylusOnly').checked && e.pointerType!=='pen')) return;
            e.preventDefault(); pointerId=e.pointerId; canvas.setPointerCapture(pointerId);
            isDrawing=true; points=[point(e)]; paintStroke(); renderInk();
        }
        function draw(e) {
            if (!isDrawing || e.pointerId!==pointerId) return;
            e.preventDefault();
            const events=e.getCoalescedEvents?.() || [];
            for(const sample of events.length ? events : [e]) points.push(point(sample));
            paintStroke(); renderInk();
        }
        function stopDrawing(e) {
            if(!isDrawing || (e && e.pointerId!==pointerId)) return;
            if(e?.type==='pointerup') { points.push(point(e)); paintStroke(); }
            compositeStroke(inkCtx,ink.width,ink.height);
            isDrawing=false;
            if (canvas.hasPointerCapture(pointerId)) canvas.releasePointerCapture(pointerId);
            pointerId=null; points=[]; commitInk(); renderInk();
        }
        canvas.addEventListener('pointerdown',startDrawing);
        canvas.addEventListener('pointermove',draw);
        canvas.addEventListener('pointerup',stopDrawing);
        canvas.addEventListener('pointercancel',stopDrawing);
        canvas.addEventListener('lostpointercapture',stopDrawing);
        toolBtns.forEach(btn => btn.addEventListener('click',()=>{
            stopDrawing(); currentTool=btn.dataset.tool;
            toolBtns.forEach(b=>b.setAttribute('aria-pressed',String(b===btn)));
            currentLineWidth=sizes[currentTool]; sizeInput.value=currentLineWidth;
            document.getElementById('penSizeValue').textContent=`${currentLineWidth} px`;
        }));
        sizeInput.addEventListener('input',()=>{
            stopDrawing(); currentLineWidth=Number(sizeInput.value); sizes[currentTool]=currentLineWidth;
            document.getElementById('penSizeValue').textContent=`${currentLineWidth} px`;
        });
        function setInkColor(color) {
            stopDrawing(); currentColor=color; document.getElementById('customColor').value=color;
            colorBtns.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.color===color)));
            if(currentTool==='eraser') document.querySelector('[data-tool="pen"]').click();
        }
        colorBtns.forEach(btn=>btn.addEventListener('click',()=>setInkColor(btn.dataset.color)));
        document.getElementById('customColor').addEventListener('input',e=>setInkColor(e.target.value));
        function travelHistory(direction) {
            stopDrawing(); const next=historyIndex+direction;
            if(next<0 || next>=history.length) return;
            historyIndex=next; inkCtx.putImageData(history[historyIndex],0,0); renderInk(); updateHistoryButtons();
        }
        undoBtn.addEventListener('click',()=>travelHistory(-1)); redoBtn.addEventListener('click',()=>travelHistory(1));
        clearCanvasBtn.addEventListener('click',()=>{
            stopDrawing(); inkCtx.clearRect(0,0,ink.width,ink.height); commitInk(); renderInk();
        });
        document.getElementById('paperStyle').addEventListener('change',e=>canvasContainer.dataset.paper=e.target.value);
        document.getElementById('stylusOnly').addEventListener('change',e=>{
            stopDrawing(); canvas.style.touchAction=e.target.checked ? 'pan-y' : 'none';
            document.getElementById('drawingHint').textContent=e.target.checked ? '스타일러스로 필기하고 손가락으로 화면을 스크롤하세요.' : '손가락·마우스·스타일러스로 필기하세요. 도형은 끌어서 그립니다.';
        });
        const expandBtn=document.getElementById('expandDrawingBtn');
        function expandDrawing(expanded) {
            stopDrawing(); canvasContainer.parentElement.classList.toggle('drawing-expanded',expanded);
            expandBtn.setAttribute('aria-pressed',String(expanded)); expandBtn.textContent=expanded ? '원래 크기' : '넓게 쓰기';
        }
        expandBtn.addEventListener('click',()=>expandDrawing(expandBtn.getAttribute('aria-pressed')!=='true'));
        document.addEventListener('keydown',e=>{
            if(e.key==='Escape') expandDrawing(false);
            if(editorView.hidden || ['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)) return;
            if((e.ctrlKey || e.metaKey) && e.key.toLowerCase()==='z') { e.preventDefault(); travelHistory(e.shiftKey ? 1 : -1); }
        });
        document.getElementById('downloadDrawingBtn').addEventListener('click',()=>{
            stopDrawing(); const output=document.createElement('canvas'); output.width=ink.width; output.height=ink.height;
            const out=output.getContext('2d'); out.fillStyle='white'; out.fillRect(0,0,output.width,output.height);
            const paper=document.getElementById('paperStyle').value;
            if(paper!=='plain') {
                out.strokeStyle=paper==='ruled' ? '#dbeafe' : '#e2e8f0'; out.lineWidth=1; out.beginPath();
                const spacing=paper==='ruled' ? 28 : 24;
                for(let y=0;y<output.height;y+=spacing) { out.moveTo(0,y+.5); out.lineTo(output.width,y+.5); }
                if(paper==='grid') for(let x=0;x<output.width;x+=spacing) { out.moveTo(x+.5,0); out.lineTo(x+.5,output.height); }
                out.stroke();
            }
            out.drawImage(ink,0,0);
            const link=document.createElement('a'); link.download=`필기-${document.getElementById('drawingDate').value || '메모'}.png`; link.href=output.toDataURL(); link.click();
        });
        resetHistory();

        /* ==========================================================================
           3. AI 요약 로직 (Gemini API)
           ========================================================================== */
        const delay = ms => new Promise(res => setTimeout(res, ms));

        async function generateSummary(text, apiKey) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            
            const payload = {
                contents: [{ parts: [{ text: `다음 텍스트의 핵심 내용을 분석하여 구조적이고 명확하게 한국어로 요약해줘. 중요한 포인트는 글머리 기호로 정리해줘:\n\n${text}` }] }],
                systemInstruction: { parts: [{ text: "당신은 유능한 비서입니다. 제공된 텍스트를 분석하고 핵심 정보만 간추려 가독성 좋게 요약합니다." }] }
            };

            // 지수 백오프를 활용한 재시도 로직
            let retries = 5;
            let currentDelay = 1000;

            while (retries > 0) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        const errorData = await response.json().catch(() => ({}));
                        throw new Error(errorData.error?.message || `HTTP error! status: ${response.status}`);
                    }

                    const result = await response.json();
                    const summaryText = result.candidates?.[0]?.content?.parts?.[0]?.text;
                    
                    if (!summaryText) throw new Error("응답에서 요약 텍스트를 찾을 수 없습니다.");
                    return summaryText;

                } catch (error) {
                    console.error(`요약 실패 (남은 재시도 횟수: ${retries - 1}):`, error);
                    retries--;
                    if (retries === 0) throw error;
                    await delay(currentDelay);
                    currentDelay *= 2; // 1s, 2s, 4s, 8s...
                }
            }
        }

        aiSummaryBtn.addEventListener('click', async () => {
            const apiKey = apiKeyInput.value.trim();
            const text = textArea.value.trim();
            const editorVersion = drawingLoad;

            if (!apiKey) {
                showModal('API 키 필요', '상단 우측에 Gemini API 키를 입력해주세요.');
                return;
            }
            if (!text || text.length < 10) {
                showModal('텍스트 부족', '요약할 내용이 너무 짧습니다. 텍스트 영역에 노트를 먼저 작성해주세요.');
                return;
            }

            // UI 로딩 상태 변경
            aiSummaryBtn.disabled = true;
            aiSummaryBtn.innerHTML = `
                <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                요약 중...
            `;
            
            summaryContainer.classList.remove('hidden');
            summaryContent.innerHTML = '<div class="flex h-full items-center justify-center text-indigo-400 font-medium animate-pulse">AI가 내용을 분석하고 있습니다...</div>';

            try {
                const summary = await generateSummary(text, apiKey);
                
                if (editorVersion !== drawingLoad || textArea.value.trim() !== text) return;
                // 마크다운 형태의 단순 파싱 (볼드체, 리스트)
                const formattedSummary = summary.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                    .replace(/\*\*(.*?)\*\*/g, '<strong class="font-bold text-indigo-900">$1</strong>')
                    .replace(/\* (.*?)\n/g, '<li class="ml-4 list-disc marker:text-indigo-500">$1</li>')
                    .replace(/\n/g, '<br/>');

                summaryContent.innerHTML = formattedSummary;
                document.getElementById('textPreview').value = summary.replace(/[*#]/g, '').replace(/\s+/g, ' ').trim().slice(0,120);
            } catch (error) {
                if (editorVersion !== drawingLoad) return;
                summaryContent.textContent = '요약 중 오류가 발생했습니다. ' + error.message;
            } finally {
                // UI 상태 복구
                aiSummaryBtn.disabled = false;
                aiSummaryBtn.innerHTML = `
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    AI 요약
                `;
            }
        });

        closeSummaryBtn.addEventListener('click', () => {
            summaryContainer.classList.add('hidden');
        });

        /* ==========================================================================
           4. 공통 모달 UI 로직
           ========================================================================== */
        function showModal(title, message) {
            modalTitle.textContent = title;
            modalMessage.textContent = message;
            messageModal.classList.remove('hidden');
            
            // 약간의 딜레이 후 opacity 변경 (애니메이션)
            setTimeout(() => {
                messageModal.classList.remove('opacity-0');
                messageModal.querySelector('div').classList.remove('scale-95');
            }, 10);
        }

        function closeModal() {
            messageModal.classList.add('opacity-0');
            messageModal.querySelector('div').classList.add('scale-95');
            
            setTimeout(() => {
                messageModal.classList.add('hidden');
            }, 200);
        }

        modalCloseBtn.addEventListener('click', closeModal);
        const storageKey = 'smart-ai-notes-v1';
        const contentsView = document.getElementById('contentsView');
        const editorView = document.getElementById('editorView');
        const navigation = document.getElementById('editorNavigation');
        const textDate = document.getElementById('textDate');
        const drawingDate = document.getElementById('drawingDate');
        const textPreview = document.getElementById('textPreview');
        const drawingPreview = document.getElementById('drawingPreview');
        const saveStatus = document.getElementById('saveStatus');
        let notes = [];
        let activeTextId = null;
        let activeDrawingId = null;
        let drawingLoad = 0;
        let storageReadable = true;
        try {
            const saved = JSON.parse(localStorage.getItem(storageKey) || '[]');
            if (!Array.isArray(saved) || saved.some(n => !n || typeof n.id !== 'string' || !['text','drawing'].includes(n.type) || !/^\d{4}-\d{2}-\d{2}$/.test(n.date) || typeof n.content !== 'string' || typeof n.preview !== 'string')) throw new Error('Invalid notes');
            notes = saved;
        } catch {
            storageReadable = false;
            showModal('저장 내역 확인 필요', '저장된 메모를 읽을 수 없습니다. 기존 데이터를 보호하기 위해 저장을 중지했습니다. 브라우저 저장소 설정을 확인해주세요.');
        }
        function today() {
            const date = new Date();
            return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
        }
        function oneLine(value) { return value.replace(/\s+/g,' ').trim().slice(0,120); }
        function renderContents() {
            const list = document.getElementById('noteList');
            list.replaceChildren();
            if (!notes.length) {
                const empty = document.createElement('p');
                empty.textContent = '아직 저장된 메모가 없습니다. 새 메모를 작성해보세요.';
                list.append(empty);
                return;
            }
            let date = '', group;
            [...notes].sort((a,b) => b.date.localeCompare(a.date) || (b.updatedAt || '').localeCompare(a.updatedAt || '')).forEach(note => {
                if (date !== note.date) {
                    date = note.date;
                    group = document.createElement('section'); group.className = 'date-group';
                    const heading = document.createElement('h3'); heading.textContent = date;
                    group.append(heading); list.append(group);
                }
                const card = document.createElement('button'); card.className = 'note-card';
                const kind = document.createElement('span'); kind.className = 'note-kind'; kind.textContent = note.type === 'text' ? '텍스트 메모' : '필기 메모';
                const preview = document.createElement('span'); preview.className = 'note-preview';
                preview.textContent = oneLine(note.preview || (note.type === 'text' ? note.content : '필기 메모 · 요약 미입력'));
                card.append(kind,preview); card.addEventListener('click',() => openEditor(note)); group.append(card);
            });
        }
        function openEditor(note = null) {
            stopDrawing();
            drawingLoad++;
            contentsView.hidden = true; editorView.hidden = false; navigation.hidden = false;
            activeTextId = note?.type === 'text' ? note.id : null;
            activeDrawingId = note?.type === 'drawing' ? note.id : null;
            textArea.value = note?.type === 'text' ? note.content : '';
            textPreview.value = note?.type === 'text' ? note.preview : '';
            drawingPreview.value = note?.type === 'drawing' ? note.preview : '';
            textDate.value = note?.type === 'text' ? note.date : today();
            drawingDate.value = note?.type === 'drawing' ? note.date : today();
            summaryContainer.classList.add('hidden'); summaryContent.replaceChildren();
            saveStatus.textContent = '';
            document.getElementById('paperStyle').value = ['grid','ruled','plain'].includes(note?.paper) ? note.paper : 'grid';
            canvasContainer.dataset.paper = document.getElementById('paperStyle').value;
            resetInk(); initCanvas();
            canvas.style.pointerEvents = note?.type === 'drawing' ? 'none' : '';
            document.getElementById('saveDrawingBtn').disabled = note?.type === 'drawing';
            if (note?.type === 'drawing') {
                const version = drawingLoad;
                const image = new Image();
                image.onload = () => {
                    if (version !== drawingLoad) return;
                    inkCtx.drawImage(image,0,0,ink.width,ink.height);
                    resetHistory(); renderInk(); rememberSaved('drawing');
                    canvas.style.pointerEvents = '';
                    document.getElementById('saveDrawingBtn').disabled = false;
                };
                image.onerror = () => {
                    if (version === drawingLoad) showModal('필기 복원 실패','필기 이미지를 읽지 못했습니다. 원본을 보호하기 위해 필기 저장을 중지했습니다. 목차로 돌아가 다시 열어주세요.');
                };
                image.src = note.content;
            }
            rememberSaved('text'); rememberSaved('drawing');
            window.scrollTo(0,0);
        }
        function saveNote(type) {
            if (type === 'drawing') stopDrawing();
            const dateInput = type === 'text' ? textDate : drawingDate;
            if (!dateInput.reportValidity()) return;
            if (type === 'text' && !textArea.value.trim()) { showModal('내용 필요','텍스트 메모를 작성해주세요.'); return; }
            if (!storageReadable) { showModal('저장 불가','기존 메모를 읽을 수 없어 저장할 수 없습니다. 브라우저 저장소 설정을 확인해주세요.'); return; }
            const id = (type === 'text' ? activeTextId : activeDrawingId) || crypto.randomUUID();
            const note = {id,type,date:dateInput.value,content:type === 'text' ? textArea.value : exportInk(),preview:oneLine(type === 'text' ? textPreview.value : drawingPreview.value),updatedAt:new Date().toISOString(),...(type === 'drawing' ? {paper:document.getElementById('paperStyle').value} : {})};
            const next = notes.filter(n => n.id !== id).concat(note);
            try { localStorage.setItem(storageKey,JSON.stringify(next)); }
            catch { showModal('저장 실패','브라우저 저장 공간이 부족하거나 저장이 차단되었습니다. 현재 내용을 유지한 채 저장소 설정을 확인해주세요.'); return; }
            notes = next;
            if (type === 'text') activeTextId = id; else activeDrawingId = id;
            saveStatus.textContent = `${type === 'text' ? '텍스트' : '필기'} 메모를 저장했습니다. 다른 메모는 해당 저장 버튼으로 저장해주세요.`;
            // Each section is saved independently; navigation checks both current values.
            rememberSaved(type);
        }
        let savedText = '', savedDrawing = '';
        function sectionState(type) {
            return type === 'text' ? JSON.stringify([textArea.value,textDate.value,textPreview.value]) : JSON.stringify([exportInk(),drawingDate.value,drawingPreview.value,document.getElementById('paperStyle').value]);
        }
        function rememberSaved(type) { if (type === 'text') savedText = sectionState(type); else savedDrawing = sectionState(type); }
        function hasChanges() { return sectionState('text') !== savedText || sectionState('drawing') !== savedDrawing; }
        document.getElementById('newNoteBtn').addEventListener('click',() => openEditor());
        document.getElementById('saveTextBtn').addEventListener('click',() => saveNote('text'));
        document.getElementById('saveDrawingBtn').addEventListener('click',() => saveNote('drawing'));
        document.getElementById('backToContentsBtn').addEventListener('click',() => {
            if (hasChanges() && !window.confirm('저장하지 않은 변경사항이 있습니다. 저장하지 않고 목차로 이동할까요?')) return;
            stopRecording(); drawingLoad++;
            editorView.hidden = true; navigation.hidden = true; contentsView.hidden = false; renderContents();
        });
        window.addEventListener('beforeunload',event => {
            if (!editorView.hidden && hasChanges()) { event.preventDefault(); event.returnValue = ''; }
        });
        renderContents();


    </script>
</body>
